<meta name="theme-color" content="#7A1F2B">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --rule:#b9b9b9;
    --rule-dark:#3d3d3d;
    --maroon:#7a1f2b;
    --maroon-dark:#5c1620;
    --muted:#5a5a5a;
    --done:#2f6b3a;
    --focus:#1F3A5F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#e9e7e2;
    color:var(--ink);
    font-family:"Times New Roman", Georgia, "Liberation Serif", serif;
    -webkit-tap-highlight-color:transparent;
  }
  .sheet{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow:0 0 0 1px rgba(0,0,0,0.06);
    padding:28px 22px 90px;
    position:relative;
  }
  h1,h2,h3{font-family:"Times New Roman", Georgia, serif; font-weight:700;}
  .doc-title{
    text-align:center;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:22px;
  }
  .doc-title .kicker{
    font-size:12.5px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .doc-title h1{
    font-size:21px;
    margin:0 0 6px;
    line-height:1.35;
  }
  .doc-title .subtitle{
    font-style:italic;
    font-size:14.5px;
    color:#333;
    margin:0 0 4px;
  }
  .doc-title .course{
    font-size:12.5px;
    color:var(--muted);
    margin-top:6px;
  }
  .section-label{
    font-size:14px;
    font-weight:700;
    margin:26px 0 10px;
    padding-bottom:4px;
    border-bottom:1px solid var(--ink);
  }
  .field{
    margin-bottom:16px;
  }
  .field label.q{
    display:block;
    font-size:14.5px;
    margin-bottom:6px;
    line-height:1.4;
  }
  input[type="text"], input[type="date"], input[type="number"], textarea{
    width:100%;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid var(--rule-dark);
    border-radius:2px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, textarea:focus{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  textarea{min-height:70px; resize:vertical;}
  .choice-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14.5px;
  }
  .choice-row label{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
  }
  .choice-row input{width:17px;height:17px;}
  .choice-row label.select-all-opt{
    width:100%;
    padding-bottom:6px;
    margin-bottom:4px;
    border-bottom:1px dashed var(--rule);
  }
  table.grid{
    width:100%;
    border-collapse:collapse;
    font-family:Arial, Helvetica, sans-serif;
    font-size:13px;
    margin-top:4px;
  }
  table.grid th, table.grid td{
    border:1px solid var(--rule-dark);
    padding:6px 7px;
    vertical-align:top;
    text-align:left;
  }
  table.grid th{
    background:#f1efe9;
    font-weight:700;
  }
  table.grid td.rowhead{
    font-weight:700;
    white-space:nowrap;
    background:#fafaf7;
  }
  table.grid input, table.grid textarea{
    border:none;
    padding:3px 4px;
    font-size:13px;
    min-height:auto;
    width:100%;
  }
  table.grid .cell-choice{display:flex;gap:10px;}
  table.grid .cell-choice label{display:flex;align-items:center;gap:4px;white-space:nowrap;}

  /* --- chrome / nav --- */
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:Arial, Helvetica, sans-serif;
  }
  .topbar .step{font-size:13px; color:var(--muted);}
  .topbar .partname{font-size:14px; font-weight:700;}
  .progressbar{height:4px; background:#e3e1db;}
  .progressbar > div{height:100%; background:var(--maroon); transition:width .25s ease;}

  .navbtns{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--paper);
    border-top:1px solid var(--rule);
    padding:12px 16px;
    display:flex; gap:10px; justify-content:space-between;
    max-width:720px; margin:0 auto;
    font-family:Arial, Helvetica, sans-serif;
  }
  button{
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    padding:12px 18px;
    border-radius:4px;
    border:1px solid var(--rule-dark);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  button.primary{
    background:var(--maroon);
    border-color:var(--maroon-dark);
    color:#fff;
    font-weight:700;
  }
  button.primary:active{background:var(--maroon-dark);}
  button:disabled{opacity:0.45; cursor:not-allowed;}
  button.ghost{background:transparent; border-color:var(--rule);}

  /* --- home screen --- */
  .home-picker{
    font-family:Arial, Helvetica, sans-serif;
  }
  .home-picker select{
    width:100%;
    font-size:16px;
    padding:12px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
    margin-bottom:14px;
  }
  .home-picker select:disabled{color:#999; background:#f3f2ee;}
  .home-picker button{width:100%;}
  .all-done-note{
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px; color:var(--done); font-weight:700;
    border:1px solid var(--done); border-radius:4px;
    padding:12px; margin-bottom:14px; text-align:center;
  }
  .progress-summary{
    font-family:Arial, Helvetica, sans-serif;
    font-size:13.5px; color:var(--muted);
    margin-bottom:16px;
  }
  .searchbox{
    width:100%; padding:10px; margin-bottom:14px;
    font-family:Arial, Helvetica, sans-serif; font-size:14.5px;
    border:1px solid var(--rule-dark); border-radius:4px;
  }

  /* --- review screen --- */
  .review-block{margin-bottom:22px;}
  .review-block .rb-head{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--ink); padding-bottom:4px; margin-bottom:8px;
  }
  .review-block .rb-head h3{font-size:14px; margin:0;}
  .review-block .rb-head button{padding:5px 10px; font-size:12.5px;}
  .qa{font-family:Arial, Helvetica, sans-serif; font-size:13.5px; margin-bottom:8px; line-height:1.4;}
  .qa .q{color:var(--muted);}
  .qa .a{font-weight:600;}
  .qa .a.empty{font-weight:400; color:#999; font-style:italic;}

  .banner{
    font-family:Arial, Helvetica, sans-serif;
    font-size:13px; background:#fbf3d9; border:1px solid #e2cf8a;
    padding:10px 12px; border-radius:4px; margin-bottom:16px;
  }
  .hidden{display:none !important;}
  .center-note{
    font-family:Arial, Helvetica, sans-serif; color:var(--muted);
    font-size:12.5px; text-align:center; margin-top:22px;
  }
</style>
</head>

/* =========================================================

   ========================================================= */
var STORAGE_KEY = "brgy_survey_records_v1";
var state = {
  screen:"home",         // home | form | review
  barangay:null,
  partIndex:0,
  answers:{}
};

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveRecords(records){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function blankAnswers(){
  var a = {};
  PARTS.forEach(function(part){
    part.fields.forEach(function(f){
      if(f.type === "checkbox") a[f.id] = [];
      else if(f.type === "table") a[f.id] = f.rows.map(function(){ return f.columns.map(function(){ return ""; }); });
      else a[f.id] = "";
    });
  });
  return a;
}

/* =========================================================
   4. RENDERING
   ========================================================= */
var app = document.getElementById("app");

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function render(){
  if(state.screen === "home") renderHome();
  else if(state.screen === "form") renderForm();
  else if(state.screen === "review") renderReview();
}

function renderHome(){
  var records = loadRecords();
  var doneCount = Object.keys(records).length;
  var remaining = BARANGAYS.filter(function(name){ return !records[name]; });
  var html = '';
  html += '<div class="sheet">';
  html += docTitleBlock();
  html += '<div class="progress-summary">' + doneCount + ' of ' + BARANGAYS.length + ' barangays completed on this device.</div>';
  html += '<div class="home-picker">';
  if(remaining.length === 0){
    html += '<div class="all-done-note">All 27 barangays have a saved response on this device.</div>';
  } else {
    html += '<label class="q" for="brgySelect">Select barangay to survey</label>';
    html += '<select id="brgySelect">';
    remaining.forEach(function(name){
      html += '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
    });
    html += '</select>';
    html += '<button class="primary" id="btnStart">Start Survey</button>';
  }
  html += '</div>';
  html += '<p class="center-note">A barangay drops off this list once its response has been saved. Already-completed barangays are not shown here.</p>';
  html += '</div>';
  app.innerHTML = html;

  var startBtn = document.getElementById("btnStart");
  if(startBtn){
    startBtn.addEventListener("click", function(){
      var sel = document.getElementById("brgySelect");
      state.barangay = sel.value;
      state.answers = blankAnswers();
      state.partIndex = 0;
      state.screen = "form";
      render();
    });
  }
}

function docTitleBlock(){
  var html = '<div class="doc-title">';
  html += '<div class="kicker">Academic Research Requirement — BS Information Technology</div>';
  html += '<h1>Research Survey Questionnaire</h1>';
  html += '<div class="subtitle">Local Governance and Public Service Delivery Practices in Philippine Barangays</div>';
  html += '<div class="course">A student research project on barangay administrative operations and service processes</div>';
  html += '</div>';
  return html;
}

function renderForm(){
  var part = PARTS[state.partIndex];
  var total = PARTS.length;
  var html = '';
  html += '<div class="topbar"><span class="partname">' + escapeHtml(state.barangay) + '</span><span class="step">Part ' + (state.partIndex+1) + ' of ' + total + '</span></div>';
  html += '<div class="progressbar"><div style="width:' + Math.round(((state.partIndex+1)/total)*100) + '%"></div></div>';
  html += '<div class="sheet" style="padding-top:20px;">';
  html += '<div class="section-label">' + escapeHtml(part.title) + '</div>';

  part.fields.forEach(function(f){
    html += renderField(f);
  });

  html += '</div>';
  html += '<div class="navbtns">';
  html += state.partIndex === 0
    ? '<button class="ghost" id="btnHome">Back to List</button>'
    : '<button class="ghost" id="btnBack">Back</button>';
  html += state.partIndex === total - 1
    ? '<button class="primary" id="btnReview">Review Answers</button>'
    : '<button class="primary" id="btnNext">Next</button>';
  html += '</div>';

  app.innerHTML = html;
  wireFieldInputs(part);

  var homeBtn = document.getElementById("btnHome");
  if(homeBtn) homeBtn.addEventListener("click", function(){ state.screen = "home"; render(); });
  var backBtn = document.getElementById("btnBack");
  if(backBtn) backBtn.addEventListener("click", function(){ state.partIndex--; render(); });
  var nextBtn = document.getElementById("btnNext");
  if(nextBtn) nextBtn.addEventListener("click", function(){ state.partIndex++; window.scrollTo(0,0); render(); });
  var reviewBtn = document.getElementById("btnReview");
  if(reviewBtn) reviewBtn.addEventListener("click", function(){ state.screen = "review"; window.scrollTo(0,0); render(); });
}

function renderField(f){
  var html = '<div class="field" data-fid="' + f.id + '">';
  html += '<label class="q">' + escapeHtml(f.label) + '</label>';

  if(f.type === "text"){
    html += '<input type="text" data-id="' + f.id + '" value="' + escapeHtml(state.answers[f.id] || "") + '">';
  } else if(f.type === "date"){
    html += '<input type="date" data-id="' + f.id + '" value="' + escapeHtml(state.answers[f.id] || "") + '">';
  } else if(f.type === "textarea"){
    html += '<textarea data-id="' + f.id + '">' + escapeHtml(state.answers[f.id] || "") + '</textarea>';
  } else if(f.type === "select"){
    html += '<select data-id="' + f.id + '">';
    html += '<option value=""' + (state.answers[f.id] ? '' : ' selected') + '>-- Select --</option>';
    f.options.forEach(function(opt){
      var sel = state.answers[f.id] === opt ? " selected" : "";
      html += '<option value="' + escapeHtml(opt) + '"' + sel + '>' + escapeHtml(opt) + '</option>';
    });
    html += '</select>';
  } else if(f.type === "radio"){
    html += '<div class="choice-row">';
    f.options.forEach(function(opt){
      var checked = state.answers[f.id] === opt ? "checked" : "";
      html += '<label><input type="radio" name="' + f.id + '" value="' + escapeHtml(opt) + '" ' + checked + '>' + escapeHtml(opt) + '</label>';
    });
    html += '</div>';
  } else if(f.type === "checkbox"){
    html += '<div class="choice-row">';
    if(f.selectAll){
      var allChecked = f.options.every(function(opt){ return (state.answers[f.id] || []).indexOf(opt) !== -1; });
      html += '<label class="select-all-opt"><input type="checkbox" data-selectall="' + f.id + '" ' + (allChecked ? "checked" : "") + '><strong>Select All</strong></label>';
    }
    f.options.forEach(function(opt){
      var checked = (state.answers[f.id] || []).indexOf(opt) !== -1 ? "checked" : "";
      html += '<label><input type="checkbox" data-id="' + f.id + '" value="' + escapeHtml(opt) + '" ' + checked + '>' + escapeHtml(opt) + '</label>';
    });
    html += '</div>';
  } else if(f.type === "table"){
    html += '<table class="grid"><thead><tr><th>Position/Item</th>';
    f.columns.forEach(function(c){ html += '<th>' + escapeHtml(c.label) + '</th>'; });
    html += '</tr></thead><tbody>';
    f.rows.forEach(function(rowLabel, rIdx){
      html += '<tr><td class="rowhead">' + escapeHtml(rowLabel) + '</td>';
      f.columns.forEach(function(col, cIdx){
        var val = (state.answers[f.id][rIdx] && state.answers[f.id][rIdx][cIdx]) || "";
        if(col.type === "radio"){
          html += '<td><div class="cell-choice">';
          col.options.forEach(function(opt){
            var checked = val === opt ? "checked" : "";
            html += '<label><input type="radio" name="' + f.id + '_' + rIdx + '" value="' + escapeHtml(opt) + '" data-table="' + f.id + '" data-row="' + rIdx + '" data-col="' + cIdx + '" ' + checked + '>' + escapeHtml(opt) + '</label>';
          });
          html += '</div></td>';
        } else {
          html += '<td><input type="text" data-table="' + f.id + '" data-row="' + rIdx + '" data-col="' + cIdx + '" value="' + escapeHtml(val) + '"></td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

function wireFieldInputs(part){
  part.fields.forEach(function(f){
    if(f.type === "text" || f.type === "date"){
      var el = document.querySelector('input[data-id="' + f.id + '"]');
      if(el) el.addEventListener("input", function(e){ state.answers[f.id] = e.target.value; });
    } else if(f.type === "textarea"){
      var ta = document.querySelector('textarea[data-id="' + f.id + '"]');
      if(ta) ta.addEventListener("input", function(e){ state.answers[f.id] = e.target.value; });
    } else if(f.type === "select"){
      var sel = document.querySelector('select[data-id="' + f.id + '"]');
      if(sel) sel.addEventListener("change", function(e){ state.answers[f.id] = e.target.value; });
    } else if(f.type === "radio"){
      document.querySelectorAll('input[name="' + f.id + '"]').forEach(function(r){
        r.addEventListener("change", function(e){ state.answers[f.id] = e.target.value; });
      });
    } else if(f.type === "checkbox"){
      document.querySelectorAll('input[data-id="' + f.id + '"]').forEach(function(cb){
        cb.addEventListener("change", function(e){
          var arr = state.answers[f.id] || [];
          if(e.target.checked){ if(arr.indexOf(e.target.value) === -1) arr.push(e.target.value); }
          else { arr = arr.filter(function(v){ return v !== e.target.value; }); }
          state.answers[f.id] = arr;
          if(f.selectAll){
            var sa = document.querySelector('input[data-selectall="' + f.id + '"]');
            if(sa) sa.checked = f.options.every(function(opt){ return arr.indexOf(opt) !== -1; });
          }
        });
      });
      if(f.selectAll){
        var saEl = document.querySelector('input[data-selectall="' + f.id + '"]');
        if(saEl){
          saEl.addEventListener("change", function(e){
            state.answers[f.id] = e.target.checked ? f.options.slice() : [];
            document.querySelectorAll('input[data-id="' + f.id + '"]').forEach(function(cb){
              cb.checked = e.target.checked;
            });
          });
        }
      }
    } else if(f.type === "table"){
      document.querySelectorAll('[data-table="' + f.id + '"]').forEach(function(inp){
        var evt = inp.type === "radio" ? "change" : "input";
        inp.addEventListener(evt, function(e){
          var r = parseInt(e.target.getAttribute("data-row"), 10);
          var c = parseInt(e.target.getAttribute("data-col"), 10);
          state.answers[f.id][r][c] = e.target.value;
        });
      });
    }
  });
}

function renderReview(){
  var html = '<div class="topbar"><span class="partname">' + escapeHtml(state.barangay) + '</span><span class="step">Review</span></div>';
  html += '<div class="sheet" style="padding-top:20px;">';
  html += '<div class="section-label">Review Responses</div>';
  html += '<div class="banner">Check the answers below with the respondent. Use "Edit" on any section to go back and correct it. Nothing is saved as a file until "Confirm &amp; Save" is tapped.</div>';

  PARTS.forEach(function(part, pIdx){
    html += '<div class="review-block">';
    html += '<div class="rb-head"><h3>' + escapeHtml(part.title) + '</h3><button data-edit="' + pIdx + '">Edit</button></div>';
    part.fields.forEach(function(f){
      if(f.type === "table"){
        f.rows.forEach(function(rowLabel, rIdx){
          f.columns.forEach(function(col, cIdx){
            var val = state.answers[f.id][rIdx][cIdx];
            html += qaLine(rowLabel + " — " + col.label, val);
          });
        });
      } else {
        var v = state.answers[f.id];
        if(Array.isArray(v)) v = v.join(", ");
        html += qaLine(f.label, v);
      }
    });
    html += '</div>';
  });

  html += '</div>';
  html += '<div class="navbtns">';
  html += '<button class="ghost" id="btnBackToForm">Back to Form</button>';
  html += '<button class="primary" id="btnConfirmSave">Confirm &amp; Save</button>';
  html += '</div>';

  app.innerHTML = html;

  document.querySelectorAll('[data-edit]').forEach(function(btn){
    btn.addEventListener("click", function(){
      state.partIndex = parseInt(btn.getAttribute("data-edit"), 10);
      state.screen = "form";
      window.scrollTo(0,0);
      render();
    });
  });
  document.getElementById("btnBackToForm").addEventListener("click", function(){
    state.partIndex = PARTS.length - 1;
    state.screen = "form";
    window.scrollTo(0,0);
    render();
  });
  document.getElementById("btnConfirmSave").addEventListener("click", confirmAndSave);
}

function qaLine(label, val){
  var display = (val === "" || val === undefined || val === null) ? '<span class="a empty">Not answered</span>' : '<span class="a">' + escapeHtml(val) + '</span>';
  return '<div class="qa"><div class="q">' + escapeHtml(label) + '</div>' + display + '</div>';
}

/* =========================================================
   5. SAVE: local record + XLSX export (no external libraries)
   ========================================================= */
function confirmAndSave(){
  var records = loadRecords();
  if(records[state.barangay]){
    alert(state.barangay + " already has a saved response (from " + records[state.barangay].dateSaved + "). It cannot be submitted again. Returning to the barangay list.");
    state.screen = "home";
    state.barangay = null;
    render();
    return;
  }

  var today = new Date();
  var dateStr = today.getFullYear() + "-" + pad2(today.getMonth()+1) + "-" + pad2(today.getDate());

  // 1) persist to localStorage (source of truth on this device)
  var records = loadRecords();
  records[state.barangay] = { dateSaved: dateStr, answers: state.answers };
  saveRecords(records);

  // 2) build and download the .xlsx for this barangay only
  var rows = flattenAnswersForExport();
  var fileBytes = buildXlsx(rows);
  var fname = sanitizeFilename(state.barangay) + "_" + dateStr + ".xlsx";
  downloadBlob(fileBytes, fname);

  // 3) back to home
  state.screen = "home";
  state.barangay = null;
  render();
}

function pad2(n){ return (n < 10 ? "0" : "") + n; }

function sanitizeFilename(s){
  return s.replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
}

function flattenAnswersForExport(){
  var rows = [];
  rows.push(["Barangay", state.barangay]);
  rows.push(["Date Responded", state.answers.date_accomplished || ""]);
  PARTS.forEach(function(part){
    rows.push([part.title, ""]); // section marker row
    part.fields.forEach(function(f){
      if(f.type === "table"){
        f.rows.forEach(function(rowLabel, rIdx){
          f.columns.forEach(function(col, cIdx){
            var val = state.answers[f.id][rIdx][cIdx] || "";
            rows.push([f.label + " — " + rowLabel + " — " + col.label, val]);
          });
        });
      } else {
        var v = state.answers[f.id];
        if(Array.isArray(v)) v = v.join(", ");
        rows.push([f.label, v || ""]);
      }
    });
  });
  return rows;
}

function downloadBlob(bytes, filename){
  var blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ---- minimal, dependency-free XLSX writer ---- */
/* Produces a single-sheet workbook, two columns (Field / Value),
   with section-marker rows rendered bold. Uses inline strings so
   no sharedStrings part is needed. Uses "stored" (uncompressed)
   ZIP entries so no deflate implementation is needed either. */

function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c];
  });
}

function buildSheetXml(rows){
  var xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  xml += '<cols><col min="1" max="1" width="46" customWidth="1"/><col min="2" max="2" width="60" customWidth="1"/></cols>';
  xml += '<sheetData>';
  rows.forEach(function(row, i){
    var r = i + 1;
    var isHeader = row[1] === "" && row[0] !== "Barangay" && row[0] !== "Date Responded";
    var styleA = isHeader ? ' s="1"' : '';
    xml += '<row r="' + r + '">';
    xml += '<c r="A' + r + '" t="inlineStr"' + styleA + '><is><t xml:space="preserve">' + xmlEscape(row[0]) + '</t></is></c>';
    xml += '<c r="B' + r + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(row[1]) + '</t></is></c>';
    xml += '</row>';
  });
  xml += '</sheetData></worksheet>';
  return xml;
}

var CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
  '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
  '<Default Extension="xml" ContentType="application/xml"/>' +
  '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
  '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
  '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
  '</Types>';

var RELS_ROOT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
  '</Relationships>';

var WORKBOOK_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
  '<sheets><sheet name="Survey Response" sheetId="1" r:id="rId1"/></sheets></workbook>';

var WORKBOOK_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
  '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
  '</Relationships>';

var STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
  '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
  '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
  '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
  '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
  '<cellXfs count="2">' +
  '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
  '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
  '</cellXfs></styleSheet>';

function buildXlsx(rows){
  var sheetXml = buildSheetXml(rows);
  var files = [
    {name:"[Content_Types].xml", data:strToBytes(CONTENT_TYPES)},
    {name:"_rels/.rels", data:strToBytes(RELS_ROOT)},
    {name:"xl/workbook.xml", data:strToBytes(WORKBOOK_XML)},
    {name:"xl/_rels/workbook.xml.rels", data:strToBytes(WORKBOOK_RELS)},
    {name:"xl/styles.xml", data:strToBytes(STYLES_XML)},
    {name:"xl/worksheets/sheet1.xml", data:strToBytes(sheetXml)}
  ];
  return makeZip(files);
}

function strToBytes(str){
  return new TextEncoder().encode(str);
}

/* ---- tiny "store" (uncompressed) ZIP writer ---- */
var CRC_TABLE = (function(){
  var table = [];
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++){
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i = 0; i < bytes.length; i++){
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function writeUint32LE(arr, offset, val){
  arr[offset] = val & 0xFF;
  arr[offset+1] = (val >>> 8) & 0xFF;
  arr[offset+2] = (val >>> 16) & 0xFF;
  arr[offset+3] = (val >>> 24) & 0xFF;
}
function writeUint16LE(arr, offset, val){
  arr[offset] = val & 0xFF;
  arr[offset+1] = (val >>> 8) & 0xFF;
}

function makeZip(files){
  var localChunks = [];
  var centralChunks = [];
  var offset = 0;
  var DOS_TIME = 0, DOS_DATE = 0x21; // fixed placeholder date (1980-01-01)

  files.forEach(function(file){
    var nameBytes = strToBytes(file.name);
    var data = file.data;
    var crc = crc32(data);

    var localHeader = new Uint8Array(30 + nameBytes.length);
    writeUint32LE(localHeader, 0, 0x04034b50);
    writeUint16LE(localHeader, 4, 20);   // version needed
    writeUint16LE(localHeader, 6, 0);    // flags
    writeUint16LE(localHeader, 8, 0);    // method = store
    writeUint16LE(localHeader, 10, DOS_TIME);
    writeUint16LE(localHeader, 12, DOS_DATE);
    writeUint32LE(localHeader, 14, crc);
    writeUint32LE(localHeader, 18, data.length);
    writeUint32LE(localHeader, 22, data.length);
    writeUint16LE(localHeader, 26, nameBytes.length);
    writeUint16LE(localHeader, 28, 0);   // extra length
    localHeader.set(nameBytes, 30);

    localChunks.push(localHeader, data);

    var centralHeader = new Uint8Array(46 + nameBytes.length);
    writeUint32LE(centralHeader, 0, 0x02014b50);
    writeUint16LE(centralHeader, 4, 20);
    writeUint16LE(centralHeader, 6, 20);
    writeUint16LE(centralHeader, 8, 0);
    writeUint16LE(centralHeader, 10, 0);
    writeUint16LE(centralHeader, 12, DOS_TIME);
    writeUint16LE(centralHeader, 14, DOS_DATE);
    writeUint32LE(centralHeader, 16, crc);
    writeUint32LE(centralHeader, 20, data.length);
    writeUint32LE(centralHeader, 24, data.length);
    writeUint16LE(centralHeader, 28, nameBytes.length);
    writeUint16LE(centralHeader, 30, 0);
    writeUint16LE(centralHeader, 32, 0);
    writeUint16LE(centralHeader, 34, 0);
    writeUint16LE(centralHeader, 36, 0);
    writeUint32LE(centralHeader, 38, 0);
    writeUint32LE(centralHeader, 42, offset);
    centralHeader.set(nameBytes, 46);

    centralChunks.push(centralHeader);
    offset += localHeader.length + data.length;
  });

  var centralStart = offset;
  var centralSize = 0;
  centralChunks.forEach(function(c){ centralSize += c.length; });

  var eocd = new Uint8Array(22);
  writeUint32LE(eocd, 0, 0x06054b50);
  writeUint16LE(eocd, 4, 0);
  writeUint16LE(eocd, 6, 0);
  writeUint16LE(eocd, 8, files.length);
  writeUint16LE(eocd, 10, files.length);
  writeUint32LE(eocd, 12, centralSize);
  writeUint32LE(eocd, 16, centralStart);
  writeUint16LE(eocd, 20, 0);

  var all = localChunks.concat(centralChunks, [eocd]);
  var totalLen = 0;
  all.forEach(function(c){ totalLen += c.length; });
  var out = new Uint8Array(totalLen);
  var pos = 0;
  all.forEach(function(c){ out.set(c, pos); pos += c.length; });
  return out;
}

render();
